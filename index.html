<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lemontopia</title>

  <style>
    body {
      text-align: center;
      background-color: #fffbe6;
    }

    h1 {
      font-size: 100px;
      margin-bottom: 20px;
    }

    h1 span {
      display: inline-block;
      animation: wave 1s infinite ease-in-out;
    }

    h1 span:nth-child(1) { color: red; animation-delay: 0s; }
    h1 span:nth-child(2) { color: orange; animation-delay: 0.1s; }
    h1 span:nth-child(3) { color: gold; animation-delay: 0.2s; }
    h1 span:nth-child(4) { color: green; animation-delay: 0.3s; }
    h1 span:nth-child(5) { color: blue; animation-delay: 0.4s; }
    h1 span:nth-child(6) { color: indigo; animation-delay: 0.5s; }
    h1 span:nth-child(7) { color: violet; animation-delay: 0.6s; }
    h1 span:nth-child(8) { color: red; animation-delay: 0.7s; }
    h1 span:nth-child(9) { color: orange; animation-delay: 0.8s; }
    h1 span:nth-child(10) { color: green; animation-delay: 0.9s; }

    @keyframes wave {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }
  </style>
</head>

<body>
<h1>
  <span>J</span>
  <span>O</span>
  <span>N</span>
  <span>E</span>
</h1>

  <img src="jone.gif" alt="Lemontopia GIF">

</body>
</html>
