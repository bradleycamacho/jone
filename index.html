<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JONE</title>

  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #fffbe6;
      position: relative;
    }

    h1 {
      position: relative;
      z-index: 100;
      text-align: center;
      font-size: 120px;
      font-family: Arial, sans-serif;
      margin: 30px 0;
    }

    h1 span {
      display: inline-block;
      animation: wave 1s infinite ease-in-out;
    }

    h1 span:nth-child(1) {
      color: red;
      animation-delay: 0s;
    }

    h1 span:nth-child(2) {
      color: orange;
      animation-delay: 0.1s;
    }

    h1 span:nth-child(3) {
      color: blue;
      animation-delay: 0.2s;
    }

    h1 span:nth-child(4) {
      color: violet;
      animation-delay: 0.3s;
    }

    @keyframes wave {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-30px) rotate(5deg);
      }
    }

    #joneGif {
      position: absolute;

      transition:
        left 0.7s ease,
        top 0.7s ease,
        width 0.7s ease,
        transform 0.7s ease;
    }
  </style>
</head>


<body>

  <h1>
    <span>J</span>
    <span>O</span>
    <span>N</span>
    <span>E</span>
  </h1>


  <img
    id="joneGif"
    src="Jones1.gif"
    alt="Jone"
  >


  <script>

    const gif = document.getElementById("joneGif");

    function randomizeJone() {

      // RANDOM GIF (Jones1.gif through Jones10.gif)
      const randomGif =
        Math.floor(Math.random() * 10) + 1;

      gif.src = `Jones${randomGif}.gif`;


      // RANDOM SIZE
      const randomSize =
        Math.floor(Math.random() * 300) + 150;

      gif.style.width = randomSize + "px";


      // RANDOM ROTATION
      const randomRotation =
        Math.floor(Math.random() * 90) - 45;

      gif.style.transform =
        `rotate(${randomRotation}deg)`;


      // RANDOM POSITION
      const maxX =
        window.innerWidth - randomSize;

      const maxY =
        window.innerHeight - randomSize;

      const randomX =
        Math.random() * Math.max(0, maxX);

      const randomY =
        Math.random() * Math.max(0, maxY);

      gif.style.left = randomX + "px";
      gif.style.top = randomY + "px";
    }


    // Start the chaos immediately
    randomizeJone();

    // New Jones every 3 seconds
    setInterval(randomizeJone, 3000);

  </script>

</body>

</html>
