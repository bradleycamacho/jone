<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JONE</title>

  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #fffbe6;
      position: relative;
    }

    /* GIANT WAVY JONE */
    h1 {
      position: relative;
      z-index: 100;
      text-align: center;
      font-size: 120px;
      font-family: Arial, sans-serif;
      margin: 30px 0;
      pointer-events: none;
    }

    h1 span {
      display: inline-block;
      animation: wave 1s infinite ease-in-out;
    }

    h1 span:nth-child(1) {
      color: red;
      animation-delay: 0s;
    }

    h1 span:nth-child(2) {
      color: orange;
      animation-delay: 0.1s;
    }

    h1 span:nth-child(3) {
      color: blue;
      animation-delay: 0.2s;
    }

    h1 span:nth-child(4) {
      color: violet;
      animation-delay: 0.3s;
    }

    @keyframes wave {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-30px) rotate(5deg);
      }
    }


    /* ALL THE JONES */
    .jonesGif {
      position: absolute;
      height: auto;

      transition:
        left 0.7s ease,
        top 0.7s ease,
        width 0.7s ease,
        transform 0.7s ease,
        opacity 0.4s ease;
    }


    /* JONES DISAPPEARING */
    .hidden {
      opacity: 0;
    }

  </style>
</head>


<body>

  <!-- WAVY RAINBOW JONE -->
  <h1>
    <span>J</span>
    <span>O</span>
    <span>N</span>
    <span>E</span>
  </h1>

<!-- ELEVEN JONES -->
<img class="jonesGif" src="jones1.gif" alt="Jone">
<img class="jonesGif" src="jones2.gif" alt="Jone">
<img class="jonesGif" src="jones3.gif" alt="Jone">
<img class="jonesGif" src="jones4.gif" alt="Jone">
<img class="jonesGif" src="jones5.gif" alt="Jone">
<img class="jonesGif" src="jones6.gif" alt="Jone">
<img class="jonesGif" src="jones7.gif" alt="Jone">
<img class="jonesGif" src="jones8.gif" alt="Jone">
<img class="jonesGif" src="jones9.gif" alt="Jone">
<img class="jonesGif" src="jones10.gif" alt="Jone">
<img class="jonesGif" src="jones1.gif" alt="Jone">


  <script>

    const gifs = document.querySelectorAll(".jonesGif");


    // ==========================================
    // RANDOMIZE ONE JONES
    // ==========================================

    function randomizeJone(gif) {

      // Pick a random GIF:
      // jones1.gif through jones10.gif
      const randomGif =
        Math.floor(Math.random() * 10) + 1;

      gif.src = `jones${randomGif}.gif`;


      // RANDOM SIZE
      // Between 150px and 525px
      const randomSize =
        Math.floor(Math.random() * 375) + 150;

      gif.style.width = randomSize + "px";


      // RANDOM ROTATION
      // Between -90 and +90 degrees
      const randomRotation =
        Math.floor(Math.random() * 180) - 90;

      gif.style.transform =
        `rotate(${randomRotation}deg)`;


      // RANDOM POSITION
      const maxX =
        window.innerWidth - randomSize;

      const maxY =
        window.innerHeight - randomSize;

      const randomX =
        Math.random() * Math.max(0, maxX);

      const randomY =
        Math.random() * Math.max(0, maxY);

      gif.style.left = randomX + "px";
      gif.style.top = randomY + "px";
    }



    // ==========================================
    // INDEPENDENT JONES CYCLE
    // ==========================================

    function joneCycle(gif) {

      // Every Jones gets its OWN random timer.
      // Anywhere from 3 to 10 seconds.
      const randomTime =
        Math.random() * 7000 + 3000;


      setTimeout(() => {

        // Fade this Jones out
        gif.classList.add("hidden");


        // Wait for the fade to finish
        setTimeout(() => {

          // Give it a new random:
          // GIF
          // size
          // rotation
          // position
          randomizeJone(gif);


          // Bring the new Jones back
          gif.classList.remove("hidden");


          // Start a completely new random timer
          // for THIS Jones only
          joneCycle(gif);

        }, 500);

      }, randomTime);

    }



    // ==========================================
    // RELEASE THE JONES
    // ==========================================

    gifs.forEach(gif => {

      // Give each Jones a random starting form
      randomizeJone(gif);


      // Start an independent random cycle
      joneCycle(gif);

    });

  </script>

</body>

</html>
